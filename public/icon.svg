<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#4f46e5"/>
  
  <!-- Workout barbell -->
  <g transform="translate(256, 256)">
    <!-- Left weight plate -->
    <rect x="-160" y="-20" width="20" height="40" rx="2" fill="#ffffff"/>
    <rect x="-150" y="-50" width="20" height="100" rx="2" fill="#ffffff"/>
    
    <!-- Bar -->
